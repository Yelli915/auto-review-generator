# Include this file inside your server block:
# include /etc/nginx/snippets/security-headers.conf;

add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' ws: wss: https://accounts.google.com https://oauth2.googleapis.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; script-src 'self' https://accounts.google.com https://apis.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
